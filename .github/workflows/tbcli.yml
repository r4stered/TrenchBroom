name: TrenchBroom with tbcli
on:
  push:
    branches:
      - agent-friendly
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Runs the regular platform builds and additionally uploads, per platform, a bundle of
# the TrenchBroom package with tbcli and ericw-tools next to it.
jobs:
  linux:
    uses: ./.github/workflows/ci-linux.yml
    secrets: inherit
    with:
      bundle-tbcli: true

  macos:
    uses: ./.github/workflows/ci-macos.yml
    secrets: inherit
    with:
      bundle-tbcli: true

  windows:
    uses: ./.github/workflows/ci-windows.yml
    secrets: inherit
    with:
      bundle-tbcli: true
